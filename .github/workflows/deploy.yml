name: GitOps Multi-Environment Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ closed ]
  release:
    types: [ published ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      EC2_INSTANCE_ID: i-07eac60aeb237b118

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::962606119198:role/GitHubActionsSSMRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Test SSM connection
        run: |
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["echo 'SSM is working'"] \
            --output text

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["bash ~/deploy/deploy.sh"] \
            --output text
